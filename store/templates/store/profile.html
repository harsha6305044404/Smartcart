<!DOCTYPE html>
<html>
<head>
    <title>My Profile - SmartCart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        nav {
            background: #111827;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 7px;
        }
    </style>
    {% load static %}
    <link rel="stylesheet" href="{% static 'store/css/responsive.css' %}">
</head>

<body>

<nav>
    <h2>ðŸ›’ SmartCart</h2>

    <div>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'cart' %}">Cart</a>
        <a href="{% url 'wishlist' %}">Wishlist</a>
        <a href="{% url 'my_orders' %}">My Orders</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>
</nav>

<div class="container">

    <div class="card">

        <h1>My Profile</h1>

        <p>
            Username:
            <strong>{{ profile_user.username }}</strong>
        </p>

        {% if message %}
            <div class="success">
                {{ message }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <label>First Name</label>
            <input
                type="text"
                name="first_name"
                value="{{ profile_user.first_name }}"
            >

            <label>Last Name</label>
            <input
                type="text"
                name="last_name"
                value="{{ profile_user.last_name }}"
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                value="{{ profile_user.email }}"
            >

            <button type="submit">
                Update Profile
            </button>

        </form>

    </div>

</div>

</body>
</html>
