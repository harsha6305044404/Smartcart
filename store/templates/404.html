<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - SmartCart</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'store/css/responsive.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 80px 20px;
        }

        .error-box {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            font-size: 80px;
            margin: 0;
        }

        h2 {
            margin: 10px 0;
        }

        p {
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

<div class="error-box">

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
        Sorry, the page you are looking for does not exist.
    </p>

    <a href="/" class="btn">Back to SmartCart</a>

</div>

</body>
</html>
